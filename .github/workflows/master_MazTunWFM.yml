# ──────────────────────────────────────────────────────────────────────────────
# master_MazTunWFM.yml
# Full-stack CI/CD — Azure App Service (ZIP deploy) + Azure Static Web Apps
#
# Backend deployment: ZIP archive upload — no Docker, no ACR required.
# Azure App Service runs Node.js directly with a custom startup command.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   AZURE_WEBAPP_PUBLISH_PROFILE     — Azure Portal → Web App → Get publish profile
#   AZURE_STATIC_WEB_APPS_API_TOKEN  — Azure Static Web Apps resource → Manage token
#
# Required GitHub Variables (Settings → Secrets and variables → Variables):
#   AZURE_WEBAPP_NAME          — Azure Web App name  (e.g. mazarine-api)
#   REACT_APP_API_URL          — Backend API base URL (e.g. https://mazarine-api.azurewebsites.net)
#   REACT_APP_AZURE_CLIENT_ID  — Azure AD app client ID  (SSO)
#   REACT_APP_AZURE_TENANT_ID  — Azure AD tenant ID      (SSO)
# ──────────────────────────────────────────────────────────────────────────────

name: CI/CD — MazTunWFM Full Stack

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Deploy backend'
        required: false
        default: 'true'
        type: boolean
      deploy_frontend:
        description: 'Deploy frontend'
        required: false
        default: 'true'
        type: boolean

# ── JOB 1 — detect which parts of the repo changed ───────────────────────────
jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend:  ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - name: Path filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'src/**'
              - 'public/**'
              - 'mazarine-timesheet-v5.jsx'
              - 'package.json'
              - 'staticwebapp.config.json'
              - 'nginx.conf'

# ── JOB 2 — build backend ZIP archive and deploy to Azure App Service ─────────
  deploy_backend:
    name: Backend — ZIP & Deploy
    runs-on: ubuntu-latest
    needs: changes
    if: |
      (github.event_name == 'push' && needs.changes.outputs.backend == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_backend == 'true')
    environment:
      name: production
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install production dependencies
        working-directory: backend
        run: npm ci --omit=dev

      - name: Create deployment archive
        run: |
          cd backend
          zip -r ../mazarine-api.zip . \
            --exclude "*.git*" \
            --exclude "*.dockerignore" \
            --exclude "Dockerfile" \
            --exclude "*.tmp"
          cd ..
          echo "Archive size: $(du -sh mazarine-api.zip | cut -f1)"

      - name: Deploy ZIP to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name:        ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package:         ./mazarine-api.zip

      # Azure App Service must be configured with this startup command:
      # npm run migrate && npm run migrate:sso && npm run migrate:schema &&
      # npm run migrate:workflows && npm run migrate:seed-workflows && npm start
      - name: Health check
        run: |
          echo "Waiting 45 s for app service to restart..."
          sleep 45
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/health \
            || echo "000")
          echo "Health check → HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Health check returned HTTP $STATUS — check App Service logs."
          fi

# ── JOB 3 — build React app and deploy to Azure Static Web Apps ───────────────
  deploy_frontend:
    name: Frontend — Build & Deploy
    runs-on: ubuntu-latest
    needs: changes
    if: |
      (github.event_name == 'push' && needs.changes.outputs.frontend == 'true') ||
      (github.event_name == 'pull_request' && github.event.action != 'closed') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_frontend == 'true')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        run: npm run build
        env:
          REACT_APP_API_URL:           ${{ vars.REACT_APP_API_URL }}
          REACT_APP_AZURE_CLIENT_ID:   ${{ vars.REACT_APP_AZURE_CLIENT_ID }}
          REACT_APP_AZURE_TENANT_ID:   ${{ vars.REACT_APP_AZURE_TENANT_ID }}
          CI: false                     # treat lint warnings as warnings, not errors

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token:                      ${{ secrets.GITHUB_TOKEN }}
          action:                          upload
          app_location:                    /
          output_location:                 build
          skip_api_build:                  true

# ── JOB 4 — close PR preview environment ─────────────────────────────────────
  close_pr_preview:
    name: Close PR Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    steps:
      - name: Close Pull Request — Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action:                          close
