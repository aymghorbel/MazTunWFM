# ──────────────────────────────────────────────────────────────────────────────
# master_MazTunWFM.yml
# Combined CI/CD — builds React frontend + Node.js backend into a single
# Azure App Service deployment (ZIP deploy, no Docker/ACR required).
#
# The Node.js server serves the React build as static files from ./build/
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   AZURE_WEBAPP_PUBLISH_PROFILE     — Azure Portal → Web App → Get publish profile
#
# Required GitHub Variables (Settings → Secrets and variables → Variables):
#   AZURE_WEBAPP_NAME          — Azure Web App name  (e.g. MazTunWFM)
#   REACT_APP_AZURE_CLIENT_ID  — Azure AD app client ID  (SSO)
#   REACT_APP_AZURE_TENANT_ID  — Azure AD tenant ID      (SSO)
# ──────────────────────────────────────────────────────────────────────────────

name: CI/CD — MazTunWFM

on:
  push:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Build React frontend ──────────────────────────────────────────────
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build React application
        run: npm run build
        env:
          REACT_APP_API_URL: ''
          REACT_APP_AZURE_CLIENT_ID: ${{ vars.REACT_APP_AZURE_CLIENT_ID }}
          REACT_APP_AZURE_TENANT_ID: ${{ vars.REACT_APP_AZURE_TENANT_ID }}
          CI: false

      # ── Prepare backend with frontend build ───────────────────────────────
      - name: Install backend production dependencies
        working-directory: backend
        run: npm ci --omit=dev

      - name: Copy frontend build into backend
        run: cp -r build backend/build

      - name: Create deployment archive
        run: |
          cd backend
          zip -r ../app.zip . \
            --exclude "*.git*" \
            --exclude "*.dockerignore" \
            --exclude "Dockerfile" \
            --exclude "*.tmp"
          cd ..
          echo "Archive size: $(du -sh app.zip | cut -f1)"

      # ── Deploy to Azure App Service ───────────────────────────────────────
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name:        ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package:         ./app.zip

      - name: Health check
        run: |
          echo "Waiting 45s for app to restart..."
          sleep 45
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/health \
            || echo "000")
          echo "Health check → HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Health check returned HTTP $STATUS — check App Service logs."
          fi
