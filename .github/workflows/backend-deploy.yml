name: Deploy Backend — Azure Web App (Docker)

on:
  push:
    branches: [main, dev]
    paths:
      - 'backend/**'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build, Push, and Deploy Backend

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        run: |
          IMAGE=${{ secrets.ACR_LOGIN_SERVER }}/mazarine-api:${{ github.sha }}
          docker build -t $IMAGE ./backend
          docker tag  $IMAGE ${{ secrets.ACR_LOGIN_SERVER }}/mazarine-api:latest
          docker push $IMAGE
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/mazarine-api:latest

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/mazarine-api:${{ github.sha }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
