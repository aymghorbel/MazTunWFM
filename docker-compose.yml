services:
  db:
    image: postgres:15-alpine
    container_name: mazarine-db
    environment:
      POSTGRES_DB: mazarine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-MazarineDB2024!}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - mazarine_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mazarine"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mazarine-api
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: mazarine
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-MazarineDB2024!}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-57fad138eecde6f67c5ab9827c966512c3163a96ad6455b3963cefb29b468227}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /api
    container_name: mazarine-frontend
    ports:
      - "3005:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mazarine_pgdata:
